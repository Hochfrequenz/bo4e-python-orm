[project]
name = "borm"
description = "A ORM tool to map between SQL databases and bo4e data model"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Hochfrequenz Unternehmensberatung GmbH", email = "info@hochfrequenz.de" }]
keywords = ["bo4e", "orm", "sql"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12"
]
dependencies = [
    "alembic>=1.12.0",
    "colorlog",
    "greenlet>=3.0.0",
    "psycopg>=3.1",
    "pydantic>=2.0.0",
    "pyhumps",
    "python-dotenv==1.0.1",
    "SQLAlchemy>=2.0.22",
    "pymysql",
    "cryptography",
    "sqlmodel==0.0.39"
]
dynamic = ["readme", "version"]

[project.urls]
Changelog = "https://github.com/Hochfrequenz/bo4e-python-orm/releases"
Homepage = "https://github.com/Hochfrequenz/bo4e-python-orm"

[tool.ruff]
line-length = 120
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "N", "PL", "RUF"]
ignore = [
    "PLR0913", # too-many-arguments
    "PLR0917", # too-many-positional-arguments
    "PLR0912", # too-many-branches
    "PLR0915", # too-many-statements
    "RUF001",  # ambiguous-unicode-character-string
    "RUF002",  # ambiguous-unicode-character-docstring
    "RUF003",  # ambiguous-unicode-character-comment
]

[tool.ruff.lint.isort]
# src/borm/models is only generated by some CI jobs' "Generate BO4E models" step, so whether
# "borm.models" resolves on disk - and thus whether ruff's isort classifies it as first-party -
# depends on which job runs. Pinning it here keeps import-sort order consistent across jobs.
known-first-party = ["borm"]

[tool.ruff.lint.per-file-ignores]
# src/borm/models is autogenerated from the BO4E schemas at CI time (not present in this checkout);
# mirrors the old .pylintrc_autogen_code disables (unused-import, line-too-long).
"src/borm/models/**" = ["F401", "E501"]

[build-system]
requires = ["hatchling>=1.31.0", "hatch-vcs", "hatch-fancy-pypi-readme"]
build-backend = "hatchling.build"

[dependency-groups]
tests = [
    "pytest==9.1.1"
]
coverage = [
    "coverage==7.15.2"
]
init_bo4e = [
    "bo4e-python-generator==0.0.13",
    "bo4e-schema-tool==0.0.9",
    "datamodel-code-generator==0.25.9"
]
linting = [
    "ruff==0.16.1",
]
spell_check = [
    "codespell==2.4.3"
]
type_check = [
    "mypy==2.3.0",
    {include-group = "tests"}
]
dev = [
    "pre-commit",
    {include-group = "tests"},
    {include-group = "coverage"},
    {include-group = "init_bo4e"},
    {include-group = "linting"},
    {include-group = "spell_check"},
    {include-group = "type_check"}
]

[tool.uv]
default-groups = []

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"
fragments = [{ path = "README.md" }]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/_borm_version.py"
template = '''
version = "{version}"
'''

[tool.hatch.build.targets.sdist]
exclude = ["/unittests"]

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]

[tool.mypy]
plugins = ["sqlalchemy.ext.mypy.plugin", "pydantic.mypy"]
follow_imports = "silent"
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_reexport = true
# for strict mypy: (this is the tricky one :-))
disallow_untyped_defs = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true
